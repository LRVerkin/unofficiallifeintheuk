name = "unofficial-life-in-the-uk"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Required by @astrojs/cloudflare's session support; declaring it here silences
# the "Invalid binding `SESSION`" build warning. Replace `id` with the real KV
# namespace id in the Cloudflare dashboard before the first deploy.
[[kv_namespaces]]
binding = "SESSION"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
