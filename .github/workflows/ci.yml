name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is intentionally NOT set here — `pnpm/action-setup@v4` now
        # rejects having both an explicit `version:` and `packageManager` in
        # package.json. Letting it read pnpm@10.21.0 from package.json keeps
        # CI and local installs on the same version.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (JS/TS/Astro)
        run: pnpm lint

      - name: Lint (CSS)
        run: pnpm lint:styles

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build
